services:

  livewraith:
    container_name: aiphishlivewraith
    image: ghcr.io/aiphish/aiphish-livewraith:0.0.1
    restart: no
    ports:
      - 8333:80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]