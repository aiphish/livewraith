[project]
name = "aiphish-livewraith"

version = "0.1.0"
description = "Live streaming wraith for the aiphish platform."
requires-python = ">=3.12"

dependencies = [
    "aiortc>=1.15.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "websockets>=17.0.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.uv.build-backend]
module-name = "aiphish.livewraith"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "opencv-stubs>=0.1.3",
]
